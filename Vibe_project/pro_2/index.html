<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人名片 · 牢小科</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <!-- 名片卡片 -->
    <article class="card" id="card">
      <div class="card__glow" aria-hidden="true"></div>

      <!-- 左侧：头像区 -->
      <section class="card__media">
        <div class="avatar">
          <img
            src="https://picsum.photos/seed/avatar/360/360"
            alt="牢小科的头像"
          />
          <span class="avatar__ring" aria-hidden="true"></span>
        </div>
      </section>

      <!-- 右侧：信息区 -->
      <section class="card__body">
        <!-- 姓名与头衔（替换成你自己的信息） -->
        <p class="role">全栈工程师 · 独立开发者</p>
        <h1 class="name">牢小科</h1>
        <p class="intro">
          热爱把复杂问题变得简单，专注于构建优雅、可靠的数字产品。
        </p>

        <!-- 联系方式 -->
        <ul class="contacts">
          <li class="contact" data-copy="hi@linzhiyuan.dev" data-label="邮箱">
            <span class="contact__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="m3 7 9 6 9-6"></path>
              </svg>
            </span>
            <span class="contact__text">hi@linzhiyuan.dev</span>
          </li>

          <li class="contact" data-copy="+86 138 0000 0000" data-label="电话">
            <span class="contact__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path>
              </svg>
            </span>
            <span class="contact__text">+86 138 0000 0000</span>
          </li>

          <li class="contact" data-copy="https://github.com/linzhiyuan" data-label="主页">
            <span class="contact__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M2 12h20"></path>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </span>
            <span class="contact__text">github.com/linzhiyuan</span>
          </li>
        </ul>

        <p class="hint">点击联系方式即可复制</p>
      </section>
    </article>
  </main>

  <!-- 复制成功提示 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="main.js"></script>
</body>
</html>
