<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>使用事件</title>
    <style>
      p {
        padding: 2em;
      }
      #plane {
        position: relative;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>使用事件</h1>
    </header>

    <section>
      <h2>使用简单事件处理器</h2>
      <p
        onmouseover="
          this.style.background = 'gray';
          this.style.color = 'red';
        "
        onmouseout="
          this.style.removeProperty('color');
          this.style.removeProperty('background');
        "
      >
        这是一段用于排版预览的占位文字，用来展示字体、行距和布局效果。
        在设计界面、网页或文档时，可以先用这段文字填充，等内容确定后再替换。
        天玄地黄，宇宙洪荒，日月盈昃，辰宿列张，寒来暑往，秋收冬藏。
      </p>
    </section>
    <section>
      <h2>使用DOM和事件对象</h2>
      <p>使用键盘WASD来移动飞机，鼠标左键单击放大飞机，按alt时单击缩小飞机</p>

    <script>
      const plane = document.getElementById("plane");
      // 保存按键状态
      const keys = {
        w: false,
        s: false,
        a: false,
        d: false,
      };
      const speed = 3; // 移动像素速度

      // 键盘按下：标记为true
      document.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();
        if (keys.hasOwnProperty(key)) {
          keys[key] = true;
        }
      });
      // 键盘松开：标记false
      document.addEventListener("keyup", (e) => {
        const key = e.key.toLowerCase();
        if (keys.hasOwnProperty(key)) {
          keys[key] = false;
        }
      });

      // 动画循环，每一帧更新位置
      function moveLoop() {
        // 获取当前top数值，去掉px
        let topVal = parseInt(getComputedStyle(plane).top);//getComput...，得到最终的样式(考虑行内等的)
        let leftVal = parseInt(getComputedStyle(plane).left);//parseInt，转化为整数，舍弃掉单位。

        if (keys.w) {
          topVal -= speed; // W向上 top减小
        }
        if (keys.s) {
          topVal += speed; // S向下 top增大
        }
        if (keys.a) {
          leftVal -= speed;
        }
        if (keys.d) {
          leftVal += speed;
        }

        plane.style.top = topVal + "px";
        plane.style.left = leftVal + "px";

        requestAnimationFrame(moveLoop);//浏览器自带的动画 API，等到浏览器下一次屏幕刷新的时候，去执行传入的函数
      }
      moveLoop();

      // 鼠标点击：放大；alt+点击缩小
      plane.addEventListener("click", function (e) {
        let w = parseInt(plane.getAttribute("width"));
        if (e.altKey) {
          // alt按下，缩小
          plane.setAttribute("width", w - 10);
          plane.setAttribute("height", w - 10);
        } else {
          // 普通点击放大
          plane.setAttribute("width", w + 10);
          plane.setAttribute("height", w + 10);
        }
      });
    </script>
  </body>
</html>
