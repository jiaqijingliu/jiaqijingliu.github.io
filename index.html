<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://www.bilibili.com/favicon.ico" />
    <title>StayInTop</title>
    <meta name="description" content="StayInTop 的个人站点：技术栈、学习笔记与项目展示。" />

    <script>
      // 首次绘制前套用本地保存的外观设置，避免闪一下默认样式再跳回用户的选择。
      // 只写 data-* 属性，具体数值由 CSS 里的 html[data-*] 规则决定。
      (function () {
        try {
          var d = document.documentElement;
          var s = window.localStorage;
          var t = s.getItem("theme");
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          d.setAttribute("data-theme", t);
          var c = s.getItem("theme-color");
          if (c) d.style.setProperty("--primary", c);
          d.setAttribute("data-logo-font", s.getItem("logo-font") || "script");
          d.setAttribute("data-font", s.getItem("text-font") || "sans");
          d.setAttribute("data-width", s.getItem("content-width") || "md");
          d.setAttribute("data-select", s.getItem("text-select") || "off");
          d.setAttribute("data-dock", s.getItem("toggle-dock") || "right");
          var dy = parseFloat(s.getItem("toggle-y"));
          if (dy) d.style.setProperty("--dock-y", dy + "%");
          // 字号是连续值，没法做成 data-* 枚举，只能直接写内联
          var fs = parseFloat(s.getItem("font-size"));
          if (fs) d.style.fontSize = fs + "px";
        } catch (e) {}
      })();
    </script>

    <link rel="stylesheet" href="./src/css/normalize.css" />
    <link rel="stylesheet" href="./src/css/style.css?v=13" />
  </head>

  <body>
    <nav id="nav">
      <input type="checkbox" id="nav-toggle" class="nav-toggle" />
      <label for="nav-toggle" class="nav-toggle-label" aria-label="切换导航菜单">
        <span></span>
        <span></span>
        <span></span>
      </label>
      <ol>
        <li><a href="#/home" title="返回首页">StayInTop</a></li>
        <li><a href="#/home" data-route="home">首页</a></li>
        <li><a href="#/projects" data-route="projects">项目</a></li>
        <li><a href="#/blog" data-route="blog">博客</a></li>
        <li><a href="#/about" data-route="about">关于</a></li>
      </ol>
    </nav>



    <main id="view"></main>

    <footer>
      &copy;<span id="year">2026</span>&nbsp;StayInTop All rights reserved
    </footer>

    <button
      id="theme-toggle-btn"
      class="theme-toggle"
      aria-label="主题设置"
      title="主题设置"
    >
      ⚙️
    </button>
    <div id="theme-panel" class="theme-panel" hidden>
      <div class="theme-panel__row">
        <span class="theme-panel__label">亮暗模式</span>
        <button id="dark-toggle" class="theme-panel__dark-btn" type="button">
          🌙 深色
        </button>
      </div>

      <div class="theme-panel__row theme-panel__row--col">
        <span class="theme-panel__label">主题色</span>
        <div id="theme-swatches" class="theme-swatches"></div>
        <input type="color" id="theme-color-picker" value="#2e7be0" />
      </div>

      <div class="theme-panel__row theme-panel__row--col">
        <span class="theme-panel__label">Logo 字体</span>
        <div id="logo-font-opts" class="theme-opts"></div>
      </div>

      <div class="theme-panel__row theme-panel__row--col">
        <span class="theme-panel__label">正文字体</span>
        <div id="text-font-opts" class="theme-opts"></div>
      </div>

      <div class="theme-panel__row theme-panel__row--col">
        <span class="theme-panel__label">
          字号
          <b id="font-size-value" class="theme-panel__value">16px</b>
        </span>
        <input
          type="range"
          id="font-size-range"
          min="13"
          max="20"
          step="0.5"
          value="16"
          aria-label="正文字号"
        />
      </div>

      <div class="theme-panel__row theme-panel__row--col">
        <span class="theme-panel__label">内容宽度</span>
        <div id="width-opts" class="theme-opts"></div>
      </div>

      <div class="theme-panel__row theme-panel__row--col">
        <span class="theme-panel__label">文本选中</span>
        <div id="select-opts" class="theme-opts"></div>
      </div>

      <button id="theme-reset" class="theme-panel__reset" type="button">
        恢复默认设置
      </button>
    </div>

    <script src="./src/js/site.js?v=13" defer></script>
    <script src="./src/js/main.js?v=13" defer></script>
  </body>
</html>
