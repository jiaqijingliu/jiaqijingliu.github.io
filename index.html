<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://www.bilibili.com/favicon.ico" />
    <title>StayInTop | 前端开发作品集</title>

    <script>
      // 在渲染前设置主题，避免暗色/主题色闪白
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          var c = localStorage.getItem("theme-color");
          if (c) document.documentElement.style.setProperty("--primary", c);
        } catch (e) {}
      })();
    </script>

    <link rel="stylesheet" href="./src/css/normalize.css" />
    <link rel="stylesheet" href="./src/css/style.css?v=4" />
  </head>

  <body>
    <nav id="nav">
      <input type="checkbox" id="nav-toggle" class="nav-toggle" />
      <label for="nav-toggle" class="nav-toggle-label" aria-label="切换导航菜单">
        <span></span>
        <span></span>
        <span></span>
      </label>
      <ol>
        <li>StayInTop</li>
        <li>
          <span><a href="#/home" data-route="home">首页</a></span>
        </li>
        <li>
          <span><a href="#/blog" data-route="blog">博客</a></span>
        </li>
        <li>
          <span><a href="#/about" data-route="about">关于</a></span>
        </li>
      </ol>
    </nav>

    <header>
      <h1>StayInTop · 前端学习作品集</h1>
    </header>

    <main id="view"></main>

    <footer>
      &copy;<span id="year">2026</span>&nbsp;StayInTop All rights reserved
    </footer>

    <button
      id="theme-toggle-btn"
      class="theme-toggle"
      aria-label="主题设置"
      title="主题设置"
    >
      ⚙️
    </button>
    <div id="theme-panel" class="theme-panel" hidden>
      <div class="theme-panel__row">
        <span class="theme-panel__label">亮暗模式</span>
        <button id="dark-toggle" class="theme-panel__dark-btn" type="button">
          🌙 深色
        </button>
      </div>
      <div class="theme-panel__row theme-panel__row--col">
        <span class="theme-panel__label">主题色</span>
        <div id="theme-swatches" class="theme-swatches"></div>
      </div>
      <div class="theme-panel__row">
        <span class="theme-panel__label">自定义</span>
        <input type="color" id="theme-color-picker" value="#2e7be0" />
      </div>
    </div>

    <script src="./src/js/main.js" defer></script>
  </body>
</html>
