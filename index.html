<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://www.bilibili.com/favicon.ico" />
    <title>StayInTop</title>
    <meta name="description" content="StayInTop 的个人站点：技术栈、学习笔记与项目展示。" />

    <script>
      // 首次绘制前套用本地保存的外观设置，避免闪一下默认样式再跳回用户的选择。
      // 枚举型的只写 data-* 属性，具体数值由 CSS 里的 html[data-*] 规则决定；
      // 主题色和字号是连续值，只能直接写内联自定义属性。
      (function () {
        try {
          var d = document.documentElement;
          var s = window.localStorage;
          // 出厂默认是深色，不跟随系统偏好 —— 默认主题色是白色，它在浅色底上
          // 读不出来（见下面 darkenForLight）
          var t = s.getItem("theme") || "dark";
          d.setAttribute("data-theme", t);
          /* 主题色的三个小函数。和 site.js 里的 lum / darkenForLight / onPrimary
             是同一份逻辑 —— 它们得赶在首帧之前，等不到 defer 的那个文件，只能
             在这儿再写一份。改一处记得改另一处。

             lum：感知亮度 0~1，认不出来的值返回 0（当"深色"处理，于是下面两个
             函数各自退回默认行为，不会算出 NaN）。
             darkenForLight：亮色模式下把过浅的主题色压深（三通道等比缩小、保住
             色相，缩到亮度 0.38）。白色主题色压在白色页面上，导航高亮、链接
             hover 这些「拿主题色当文字色」的地方会整个消失，所以这里自动换一个
             压深版；原色照旧存着，切回深色模式就变回来。
             onPrimary：主题色上该压什么颜色。齿轮、播放键都是实心主题色底 + 它。 */
          function lum(c) {
            if (!/^#[0-9a-f]{6}$/i.test(String(c))) return 0;
            var n = parseInt(c.slice(1), 16);
            return (
              (0.2126 * ((n >> 16) & 255) +
                0.7152 * ((n >> 8) & 255) +
                0.0722 * (n & 255)) /
              255
            );
          }
          function darkenForLight(c) {
            var L = lum(c);
            if (L <= 0.6) return c;
            var n = parseInt(c.slice(1), 16);
            var k = 0.38 / L;
            var f = function (v) {
              return Math.round(v * k);
            };
            return (
              "#" +
              (
                (1 << 24) +
                (f((n >> 16) & 255) << 16) +
                (f((n >> 8) & 255) << 8) +
                f(n & 255)
              )
                .toString(16)
                .slice(1)
            );
          }
          function onPrimary(c) {
            return lum(c) > 0.6 ? "#1a1a1a" : "#ffffff";
          }
          // 主题色永远写一遍（不只是存过才写）：实际用哪个还得看亮暗模式
          var c = s.getItem("theme-color") || "#ffffff";
          if (t === "light") c = darkenForLight(c);
          d.style.setProperty("--primary", c);
          d.style.setProperty("--on-primary", onPrimary(c));
          d.setAttribute("data-width", s.getItem("content-width") || "md");
          d.setAttribute("data-select", s.getItem("text-select") || "off");
          d.setAttribute("data-dock", s.getItem("toggle-dock") || "right");
          // 「背景」这一项也在这里落一次：不然选了星空的用户刷新时会先按默认
          // 渲染出粒子层、再被脚本换掉，闪一下。**不在这里按 background 强切
          // 深色** —— 那会把用户自己选的浅色主题每次刷新都推翻。
          d.setAttribute("data-bg", s.getItem("background") || "particles");
          var dy = parseFloat(s.getItem("toggle-y"));
          if (dy) d.style.setProperty("--dock-y", dy + "%");
          // 字号是连续值，没法做成 data-* 枚举，只能直接写内联
          var fs = parseFloat(s.getItem("font-size"));
          if (fs) d.style.fontSize = fs + "px";
        } catch (e) {}
      })();
    </script>

    <link rel="stylesheet" href="./src/css/normalize.css" />
    <link rel="stylesheet" href="./src/css/style.css?v=140" />
  </head>

  <body>
    <!-- 全站背景粒子层。画在正文后面，只有卡片盖不到的地方（内容列两侧的
         留白、首页那几段没有卡片托底的文字底下）才透得出来 —— 就别指望它
         当主角，它的活儿是把空白填得不那么像「没做完」。

         位置很关键：必须是 #view 之外的 body 直接子元素，路由换页时
         view.innerHTML 才换不到它，整站只建一次、切页不再重建。
         负层级要配 style.scss 里 body 那条 isolation 才画得出来，理由见那边。
         绘制逻辑在 src/js/main.js 的 initParticles()。 -->
    <canvas class="particle-field" aria-hidden="true"></canvas>

    <!-- 星空背景层。和粒子层互斥，由 <html data-bg> 选（设置面板「背景」那一行）。
         位置同样关键：必须是 #view 之外的 body 直接子元素，路由换页换不到它。

         **和上面那个画布正相反**：它在内容**下面**（z-index: -1）且不透明 ——
         那层夜空渐变本身就是页面背景。要能看见还得配 _starfield.scss 里
         `html[data-bg="stars"] body { isolation: isolate }`，推导写在那儿。
         绘制逻辑在 src/js/bg.js。 -->
    <canvas class="star-field" aria-hidden="true"></canvas>

    <nav id="nav">
      <input type="checkbox" id="nav-toggle" class="nav-toggle" />
      <label for="nav-toggle" class="nav-toggle-label" aria-label="切换导航菜单">
        <span></span>
        <span></span>
        <span></span>
      </label>
      <!-- 图标是内联 SVG（惯例见 README「图标」一节）。都是装饰性的：
           aria-hidden 让读屏跳过，链接的可访问名仍来自文字。
           logo 那个链接不加 —— 它是花体字标，摆个小图标会跟书法字打架。 -->
      <ol>
        <li><a href="#/home" title="返回首页">StayInTop</a></li>
        <li>
          <a href="#/home" data-route="home">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3.4 10.8 12 4l8.6 6.8M5.8 9.5v9.7a1.2 1.2 0 0 0 1.2 1.2h10a1.2 1.2 0 0 0 1.2-1.2V9.5" />
            </svg>
            首页
          </a>
        </li>
        <li>
          <a href="#/projects" data-route="projects">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3.5 7.4a1.6 1.6 0 0 1 1.6-1.6h3.4l1.9 2.2h8.5a1.6 1.6 0 0 1 1.6 1.6v8.6a1.6 1.6 0 0 1-1.6 1.6H5.1a1.6 1.6 0 0 1-1.6-1.6z" />
            </svg>
            项目
          </a>
        </li>
        <li>
          <a href="#/blog" data-route="blog">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6.3 3.6h7l4.4 4.4v12.4H6.3zM13.3 3.6v4.4h4.4M9.3 12.5h5.4M9.3 16.1h5.4" />
            </svg>
            博客
          </a>
        </li>
        <li>
          <a href="#/game" data-route="game">
            <!-- 手柄：机身 + 左边十字键 + 右边两个按键。和齿轮一样用了
                 <rect>/<circle> 而不只是一条 <path>（理由见 README「图标」一节） -->
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="2" y="7" width="20" height="11" rx="4" />
              <path d="M6.5 10.5v4M4.5 12.5h4" />
              <circle cx="15.6" cy="11.4" r="1" />
              <circle cx="18.1" cy="13.9" r="1" />
            </svg>
            娱乐
          </a>
        </li>
        <li>
          <a href="#/about" data-route="about">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 11.7a3.85 3.85 0 1 0 0-7.7 3.85 3.85 0 0 0 0 7.7zM4.6 20.4a7.4 7.4 0 0 1 14.8 0" />
            </svg>
            关于
          </a>
        </li>
      </ol>
    </nav>



    <main id="view"></main>

    <footer>
      <div class="footer__inner">
        <a class="footer__brand" href="#/home">StayInTop</a>

        <!-- 右半边一行：版权 + 版权声明 + GitHub。
             这里故意不复述顶部导航（首页/项目/博客/关于）—— 那条导航是 sticky 的，
             翻到页脚时还在视口里挂着，抄一份就是同一批链接同屏出现两次。
             版权声明不在顶部导航里，这一行是它仅有的入口之一，别顺手也删了。 -->
        <p class="footer__meta">
          <span class="footer__copy"
            >&copy; <span id="year">2026</span> StayInTop &middot; All rights
            reserved</span
          >
          <!-- 两个链接包一层：窄屏放不下时整组挪到下一行，不会只把 GitHub
               一个甩下去（那样看着像多打了一个词）。这一层必须留着 ——
               拆开的话两个链接各自是 flex 项，会分开换行。 -->
          <span class="footer__links">
            <a href="copyright.html">版权声明</a>
            <!-- 站外的挂在最后，CSS 靠 .footer__ext 在它前面画一道细竖线 -->
            <a
              class="footer__ext"
              href="https://github.com/jiaqijingliu"
              target="_blank"
              rel="noopener"
              >GitHub</a
            >
          </span>
        </p>
      </div>
    </footer>

    <button
      id="theme-toggle-btn"
      class="theme-toggle"
      aria-label="主题设置"
      title="主题设置"
    >
      <!-- 齿轮。用 <circle> + <path> 两根齿形短横，不是一条路径描轮廓 ——
           手写带齿的单路径极易走形，圆的半径是显式数字、不会写错 -->
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4.2" />
        <path d="M16.2 12H19.4M14.1 15.6 15.7 18.4M9.9 15.6 8.3 18.4M7.8 12H4.6M9.9 8.4 8.3 5.6M14.1 8.4 15.7 5.6" />
      </svg>
    </button>
    <div id="theme-panel" class="theme-panel" hidden>
      <div class="theme-panel__row">
        <span class="theme-panel__label">亮暗模式</span>
        <!-- 两个图标都在，显示哪个由 CSS 看 <html data-theme> 决定（见 _theme.scss）。
             亮色显示月亮 =「切到深色」，跟原来的 emoji 一个意思。 -->
        <button id="dark-toggle" class="theme-panel__dark-btn" type="button">
          <svg class="nav-icon nav-icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20.5 14.8A8.7 8.7 0 1 1 9.2 3.5a7 7 0 0 0 11.3 11.3z" />
          </svg>
          <svg class="nav-icon nav-icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="2.8" />
            <path d="M17.2 12h4M15.7 15.7 18.5 18.5M12 17.2v4M8.3 15.7 5.5 18.5M6.8 12h-4M8.3 8.3 5.5 5.5M12 6.8v-4M15.7 8.3 18.5 5.5" />
          </svg>
          <span id="dark-toggle-label">深色</span>
        </button>
      </div>

      <div class="theme-panel__row theme-panel__row--col">
        <span class="theme-panel__label">主题色</span>
        <div id="theme-swatches" class="theme-swatches"></div>
        <input type="color" id="theme-color-picker" value="#ffffff" />
      </div>

      <div class="theme-panel__row theme-panel__row--col">
        <span class="theme-panel__label">
          字号
          <b id="font-size-value" class="theme-panel__value">16px</b>
        </span>
        <input
          type="range"
          id="font-size-range"
          min="13"
          max="20"
          step="0.5"
          value="16"
          aria-label="正文字号"
        />
      </div>

      <div class="theme-panel__row theme-panel__row--col">
        <span class="theme-panel__label">内容宽度</span>
        <div id="width-opts" class="theme-opts"></div>
      </div>

      <div class="theme-panel__row theme-panel__row--col">
        <span class="theme-panel__label">文本选中</span>
        <div id="select-opts" class="theme-opts"></div>
      </div>

      <!-- 这一行**只有 index.html 有**：背景层（粒子画布和星空画布）也只写在
           这个文件里，文章页和版权页那两个独立副本没有。buildOptionGroups 在
           找不到 box 时会直接跳过，所以那两页少了这一行不会有任何报错。 -->
      <div class="theme-panel__row theme-panel__row--col">
        <span class="theme-panel__label">背景</span>
        <div id="bg-opts" class="theme-opts"></div>
      </div>

      <button id="theme-reset" class="theme-panel__reset" type="button">
        恢复默认设置
      </button>
    </div>

    <script src="./src/js/site.js?v=140" defer></script>
    <script src="./src/js/main.js?v=140" defer></script>
    <script src="./src/js/bg.js?v=140" defer></script>
    <script src="./src/js/player.js?v=140" defer></script>
    <script src="./src/js/game.js?v=140" defer></script>
  </body>
</html>
