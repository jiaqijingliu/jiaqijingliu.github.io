<!-- 娱乐页：站上游戏的总入口。目前一款，做成卡片网格是为了后面加游戏时
     只往下面添一张卡片，不动这一页以外的任何东西（路由表 GAMES 另加一行）。

     卡片整张是一个 <a>：点哪儿都能进，键盘 Tab 也停得住。里面的三块文字
     都成为这个链接的可访问名，所以描述写短一点 —— 读屏念出来是一整句。

     这里 href 写 #/game/plane 而不是相对路径：本片段被 fetch 进来插到
     index.html 里，相对路径按 index.html 的位置解析（见 about.html 顶部
     那条注释），纯 hash 就没这个问题。 -->

<section class="cards-section" id="game">
  <h2>娱乐</h2>
  <div class="under-line"></div>

  <p class="game-intro">
    娱乐小游戏，利用AI Agent生成并且优化
  </p>

  <div class="game-grid">
    <a class="game-card" href="#/game/plane">
      <!-- 缩略图就是游戏里自机的形状（同一套几何），所以它不只是装饰 -->
      <span class="game-card__thumb" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path
            d="M12 2 15 10 22 13 22 15 15 14 15 19 18 22 6 22 9 19 9 14 2 15 2 13 9 10Z"
            fill="currentColor"
          />
        </svg>
      </span>
      <span class="game-card__body">
        <span class="game-card__name">飞机大战</span>
        <span class="game-card__desc">躲开敌机、把它们打下来。看能撑多久。</span>
      </span>
      <span class="game-card__go">开始 <span aria-hidden="true">→</span></span>
    </a>
  </div>
</section>
