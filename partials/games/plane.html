

<section class="cards-section game-page" id="game-plane">
  <h2 class="game-title">飞机大战</h2>
  <div class="under-line"></div>


  <div class="game-field">

    <div class="game-stage">
      <canvas class="game-canvas"></canvas>
      <div class="game-overlay"></div>
      <div class="game-pick" hidden></div>
    </div>
  </div>

  <p class="game-help"></p>


  <div class="game-keys">
    <h3 class="game-keys__title">按键设置</h3>
    <div class="game-keys__grid"></div>
    <p class="game-keys__note">
      点一下某个键位，再按你想用的键。按 Esc 取消。改动会存下来，刷新后还在。
    </p>


    <h3 class="game-keys__title game-keys__title--sub">手柄</h3>
    <div class="game-keys__grid">
      <div class="game-key">
        <span class="game-key__label">移动</span>
        <span class="game-key__btn game-key__btn--static">左摇杆</span>
      </div>
      <div class="game-key">
        <span class="game-key__label">射击</span>
        <span class="game-key__btn game-key__btn--static">RT</span>
      </div>
      <div class="game-key">
        <span class="game-key__label">技能</span>
        <span class="game-key__btn game-key__btn--static">LT</span>
      </div>
      <div class="game-key">
        <span class="game-key__label">道具</span>
        <span class="game-key__btn game-key__btn--static">A</span>
      </div>
      <div class="game-key">
        <span class="game-key__label">暂停</span>
        <span class="game-key__btn game-key__btn--static">Start</span>
      </div>
      <div class="game-key">
        <span class="game-key__label">选卡</span>
        <span class="game-key__btn game-key__btn--static">左摇杆 + A</span>
      </div>
    </div>
    <p class="game-keys__note">
      插上就能用，按标准映射走 —— 手柄的键位是固定的，不在这张表里改。
    </p>
  </div>


  <div class="game-codex game-codex--drop"></div>
  <div class="game-codex game-codex--enemy"></div>
</section>
